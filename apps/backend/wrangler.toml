name = "watch-together-backend"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[env.development]
name = "watch-together-backend-dev"

[env.production]
name = "watch-together-backend-prod"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "RoomState" ]

[[migrations]]
tag = "v2"
renamed_classes = [ { from = "RoomState", to = "Room" } ]

[observability]
enabled = true
head_sampling_rate = 1
