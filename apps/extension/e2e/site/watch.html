<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Video</title>
    <link rel="stylesheet" href="site.css" />
  </head>
  <body>
    <div id="label"></div>
    <video id="player" controls playsinline></video>
    <div id="readout"></div>
    <div id="caption"></div>
    <script src="site.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const name = params.get("v") ?? "a";
      const video = document.getElementById("player");
      video.src = `media/${name}.webm`;
      video.muted = params.has("muted");
      video.autoplay = params.has("autoplay");
      document.title = `Video ${name.toUpperCase()}`;
    </script>
  </body>
</html>
